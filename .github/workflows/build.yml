# Build canônico: GitHub Actions (fonte da verdade).
# Push em qualquer branch compila + testa; APKs saem como artifacts.
# Assinatura release SOMENTE com os secrets KEYSTORE_BASE64/KEYSTORE_PASS/
# KEY_ALIAS (job de PR de fork não tem secrets -> release sai unsigned).
name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: JDK 17 (AGP 8.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar platform + build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (prod + dev)
        run: ./gradlew :app:testProdDebugUnitTest :app:testDevDebugUnitTest --no-daemon

      - name: Decodificar keystore temporária
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble prod + dev release
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assembleProdRelease :app:assembleDevRelease --no-daemon

      - name: Verificar assinatura + checksums
        if: env.KEYSTORE_PATH != ''
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          for apk in app/build/outputs/apk/prod/release/*.apk app/build/outputs/apk/dev/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | head -4
          done
          echo "### SHA-256 dos APKs" >> "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/outputs/apk/prod/release/*.apk app/build/outputs/apk/dev/release/*.apk >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/release/*.apk

      - name: Upload relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      # Preciosismo de segurança: a keystore decodificada morre com o job,
      # mesmo se o build ou a assinatura falharem no meio.
      - name: Limpar keystore temporária
        if: always()
        run: shred -u "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"
